name: Refresh job feed

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: refresh-job-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and normalize jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node scripts/aggregate-jobs.mjs
      - name: Publish changed feed
        run: |
          git config user.name "inhouse-jobs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/jobs
          if git diff --cached --quiet; then
            echo "No feed changes"
          else
            git commit -m "data: refresh job feed"
            git push
          fi
