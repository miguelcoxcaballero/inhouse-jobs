name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the APK in a GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install dependencies and verify web app
        run: |
          npm ci
          npm test
          npm run build
          npx cap sync android

      - name: Check release version alignment
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const pkg=JSON.parse(fs.readFileSync("package.json")); const update=JSON.parse(fs.readFileSync("android-update.json")); const gradle=fs.readFileSync("android/app/build.gradle","utf8"); if (pkg.version!==update.version || !gradle.includes(`versionName "${pkg.version}"`) || Number(update.versionCode)!==Number(gradle.match(/versionCode\s+(\d+)/)?.[1])) process.exit(1);'

      - name: Restore permanent Inhouse Jobs signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.INHOUSE_JOBS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/inhouse-jobs-release.p12"

      - name: Build signed release APK
        working-directory: android
        env:
          INHOUSE_KEYSTORE_PATH: ${{ runner.temp }}/inhouse-jobs-release.p12
          INHOUSE_KEYSTORE_PASSWORD: ${{ secrets.INHOUSE_JOBS_KEYSTORE_PASSWORD }}
          INHOUSE_KEY_ALIAS: ${{ secrets.INHOUSE_JOBS_KEY_ALIAS }}
          INHOUSE_KEY_PASSWORD: ${{ secrets.INHOUSE_JOBS_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Inhouse-Jobs.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Inhouse-Jobs-APK
          path: Inhouse-Jobs.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node --input-type=module -e 'import fs from "node:fs"; process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')
          TAG="v${VERSION}"
          gh release create "$TAG" Inhouse-Jobs.apk \
            --target "$GITHUB_SHA" \
            --title "Inhouse Jobs ${TAG}" \
            --notes "Signed Inhouse Jobs Android APK. Search Spain, the UK and worldwide remote jobs, save or swipe through roles, and apply through source forms. Candidate details and CV stay on the device."
